<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Jeyanth Ravi terminal profile</title>
  <desc id="desc">A terminal-style introduction for Jeyanth Ravi, an AI and machine learning focused computer science student.</desc>
  <defs>
